name: Update public AI data
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm update:rates
      - run: pnpm update:news
      - name: Commit changed data
        run: |
          git config user.name "ai-price-map-bot"
          git config user.email "actions@github.com"
          git add data/prices.json data/news.json
          git diff --cached --quiet || git commit -m "chore: update public data"
          git push
